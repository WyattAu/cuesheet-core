[package]
name = "cuesheet-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "CDRWIN cue sheet reader and writer — tracks, indices, MM:SS:FF timing at 75 frames per second, CD-TEXT, no_std"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/cuesheet-core"
keywords = ["cue", "cuesheet", "audio", "chapters", "cd", "no-std"]
categories = ["multimedia::audio", "parser-implementations", "no-std"]
exclude = [".github/", "fuzz/"]

[features]
default = []
# `std` unlocks `std::error::Error` and the owned-`String` conveniences. The
# parser itself is `#![no_std]` + `alloc` either way.
std = []

[dependencies]
# Sole runtime dependency: the typed error, in the same shape as every other
# L0 kit in the estate (can-core, dbc-parse, dsp-core, id3-core).
thiserror = { version = "2", default-features = false }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[package.metadata.layers]
tier = "L0"
